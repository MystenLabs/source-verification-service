name: Move

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'move/**'
      - '.github/workflows/move.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Match the verifier baked into the enclave image (Makefile VERIFIER_VERSION).
      - name: Install Sui
        uses: cloudposse-github-actions/install-gh-releases@33b15dbedceb0a3425d72f54a2300202d5c3418d # pin@v1.5.0
        with:
          config: |-
            mystenlabs/sui:
              platform: ubuntu
              arch: x86_64
              extension-matching: true
              tag: testnet-v1.77.2

      # The Move.lock pins each dependency to a concrete git revision, so this
      # only git-fetches those sources (no MVR resolution). Cache them across runs.
      - name: Cache fetched Move dependencies
        uses: actions/cache@v4
        with:
          path: ~/.move
          key: move-${{ hashFiles('move/**/Move.lock') }}
          restore-keys: move-

      - name: Build and test each package
        run: |
          for dir in move/*/; do
            echo "::group::$dir"
            sui move build --path "$dir"
            sui move test --path "$dir"
            echo "::endgroup::"
          done

      # A drifted lockfile means the committed pins no longer match the manifests.
      - name: Assert the lockfiles did not change
        run: git diff --exit-code move/
